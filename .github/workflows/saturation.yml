name: Update BESS saturation page

on:
  schedule:
    - cron: "0 7 * * 1"   # every Monday 07:00 UTC (after the arbitrage workflow)
  workflow_dispatch:       # manual run from the Actions tab
    inputs:
      gen_proxy:
        description: "Estimate wind/solar from peak output where ENTSO-E has no installed capacity (slower)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: saturation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install entsoe-py pandas

      # Cachen gör att avslutade år bara hämtas en gång; även en avbruten körning sparar sina framsteg.
      - name: Restore ENTSO-E cache
        uses: actions/cache/restore@v4
        with:
          path: .entsoe_cache
          key: entsoe-cache-${{ github.run_id }}
          restore-keys: entsoe-cache-

      - name: Fetch ENTSO-E data and compute metrics
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_API_KEY }}
        run: python entso_bess_context.py --out data/saturation --years 2023 2024 2025 2026 --workers 4 ${{ inputs.gen_proxy && '--gen-proxy' || '' }}

      - name: Wind and solar penetration per bidding zone
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_API_KEY }}
        run: python entso_vre_penetration.py --out data/saturation --workers 4

      - name: Save ENTSO-E cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .entsoe_cache
          key: entsoe-cache-${{ github.run_id }}

      # Mimer kan vara tillfälligt otillgängligt; sidan byggs ändå (FCR-avsnittet visar då senast hämtade data).
      - name: Fetch FCR procurement statistics from Mimer
        continue-on-error: true
        run: |
          pip install requests
          python fetch_mimer_fcr.py --start 2024-02 --out data/saturation/se_fcr_monthly.csv

      - name: Fetch aFRR and mFRR capacity markets from the SVK data portal
        continue-on-error: true
        run: python fetch_svk_api.py --out data/saturation/se_afrr_mfrr_monthly.csv

      - name: Build web page
        run: |
          mkdir -p viewer
          python build_saturation_page.py --csv data/saturation/zone_year_metrics.csv --out viewer/saturation.html

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/saturation viewer/saturation.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update BESS saturation $(date -u +%F)"
            git pull --rebase
            git push
          fi
