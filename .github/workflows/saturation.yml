name: Update BESS saturation page

on:
  schedule:
    - cron: "0 7 * * 1"   # every Monday 07:00 UTC (after the arbitrage workflow)
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: saturation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install entsoe-py pandas

      - name: Fetch ENTSO-E data and compute metrics
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_API_KEY }}
        run: python entso_bess_context.py --out data/saturation --gen-proxy

      - name: Build web page
        run: |
          mkdir -p viewer
          python build_saturation_page.py --csv data/saturation/zone_year_metrics.csv --out viewer/saturation.html

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/saturation/zone_year_metrics.csv data/saturation/bess_input.csv viewer/saturation.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update BESS saturation $(date -u +%F)"
            git pull --rebase
            git push
          fi
